[workspace]
resolver = "2"
members = ["crates/input", "crates/calibration", "crates/profiles", "crates/haptics", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/murillomello/gamepadlab"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
gamepadlab-input = { path = "crates/input" }
gamepadlab-calibration = { path = "crates/calibration" }
gamepadlab-profiles = { path = "crates/profiles" }
gamepadlab-haptics = { path = "crates/haptics" }

[profile.release]
codegen-units = 1
lto = true
strip = true
