[package]
name = "gamepadlab"
description = "GamepadLab: test and calibrate game controllers"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "gamepadlab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["macos-private-api", "image-png"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-updater = "2.14"
tauri-plugin-process = "2.4"
serde.workspace = true
serde_json.workspace = true
log.workspace = true
gamepadlab-input.workspace = true
gamepadlab-calibration.workspace = true
gamepadlab-haptics.workspace = true
gamepadlab-profiles.workspace = true
base64 = "0.22"
rusqlite = { version = "0.41", features = ["bundled"] }
sysinfo = { version = "0.40", default-features = false, features = ["system"] }

# Dock icon swap (the same AppKit calls Tauri makes for the dev icon).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSImage"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData"] }

[dev-dependencies]
tempfile = "3"
tauri = { version = "2.12", features = ["macos-private-api", "image-png", "test"] }
