[package]
name = "gamepadlab"
description = "GamepadLab: test and calibrate game controllers"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "gamepadlab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["macos-private-api"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-updater = "2.14"
tauri-plugin-process = "2.4"
serde.workspace = true
serde_json.workspace = true
log.workspace = true
gamepadlab-input.workspace = true
gamepadlab-calibration.workspace = true
gamepadlab-haptics.workspace = true
gamepadlab-profiles.workspace = true
base64 = "0.22"
rusqlite = { version = "0.41", features = ["bundled"] }
sysinfo = { version = "0.40", default-features = false, features = ["system"] }

[dev-dependencies]
tempfile = "3"
