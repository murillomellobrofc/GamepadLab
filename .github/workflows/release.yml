name: Release

# A tag v* builds everything and opens a draft release. Running the workflow by hand
# ("Run workflow") is a test build: same packages, kept as workflow artifacts, no release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Release (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-14
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - name: macOS x64
            os: macos-14
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ''
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: ''
    runs-on: ${{ matrix.os }}
    outputs:
      release_id: ${{ steps.tauri.outputs.releaseId }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The updater compares versions, so a tag that disagrees with the app would ship a broken update.
      - name: Tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          have=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$have" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app version $have (npm run version:set -- ${GITHUB_REF_NAME#v})"
            exit 1
          fi
      # Updater artifacts are only produced when the signing key secret exists.
      - name: Release config
        shell: bash
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          if [ "$HAS_KEY" = "true" ]; then
            echo '{"bundle":{"createUpdaterArtifacts":true}}' > src-tauri/tauri.release.conf.json
          else
            echo '{}' > src-tauri/tauri.release.conf.json
          fi
      # macOS signing + notarization (optional; see docs/platforms/macos.md). The variables are
      # exported only when the secrets exist: an empty APPLE_CERTIFICATE makes Tauri try to
      # import a blank certificate and fail. Without them the app gets the ad-hoc signature.
      - name: macOS signing secrets
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!v}" ]; then
              { echo "$v<<__GAMEPADLAB_EOF__"; printf '%s\n' "${!v}"; echo "__GAMEPADLAB_EOF__"; } >> "$GITHUB_ENV"
            fi
          done
      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Without a tag name tauri-action only builds (test run).
          tagName: ${{ github.event_name == 'push' && github.ref_name || '' }}
          releaseName: GamepadLab ${{ github.ref_name }}
          releaseBody: 'Veja o CHANGELOG para detalhes. Sem telemetria.'
          releaseDraft: true
          prerelease: false
          # Windows ships both .msi and .exe; updates of the generic key go through the .exe.
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json
      # The Flatpak and Arch jobs repackage this .deb.
      - name: Keep the .deb for the Flatpak and Arch jobs
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: target/release/bundle/deb/*.deb
          retention-days: 3
      - name: Keep the packages (test run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.target }}
          path: |
            target/**/release/bundle/dmg/*.dmg
            target/**/release/bundle/msi/*.msi
            target/**/release/bundle/nsis/*.exe
            target/**/release/bundle/deb/*.deb
            target/**/release/bundle/rpm/*.rpm
            target/**/release/bundle/appimage/*.AppImage
          retention-days: 3

  flatpak:
    name: Flatpak
    needs: release
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-deb
          path: dl
      - name: Stage the .deb
        id: v
        shell: bash
        run: |
          cp dl/*.deb packaging/flatpak/gamepadlab.deb
          echo "version=$(sed -n 's/^  "version": "\(.*\)",/\1/p' src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"
      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@master
        with:
          bundle: GamepadLab_${{ steps.v.outputs.version }}_x86_64.flatpak
          manifest-path: packaging/flatpak/io.github.gamepadlab.yml
          cache: false
      - name: Attach to the release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.release.outputs.release_id }}
          FILE: GamepadLab_${{ steps.v.outputs.version }}_x86_64.flatpak
        run: |
          curl -sSf -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/octet-stream" --data-binary @"$FILE" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets?name=$FILE" > /dev/null

  arch:
    name: Arch Linux package
    needs: release
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-deb
          path: dl
      - name: Build with makepkg
        id: build
        shell: bash
        run: |
          ver=$(sed -n 's/^  "version": "\(.*\)",/\1/p' src-tauri/tauri.conf.json)
          mkdir -p /tmp/pkg
          sed "s/^pkgver=.*/pkgver=$ver/" packaging/arch/PKGBUILD > /tmp/pkg/PKGBUILD
          # Local copies with the source names, so makepkg does not download anything.
          cp dl/*.deb "/tmp/pkg/GamepadLab_${ver}_amd64.deb"
          cp LICENSE "/tmp/pkg/LICENSE-${ver}"
          useradd -m builder
          chown -R builder /tmp/pkg
          # -d: runtime dependencies (webkit2gtk…) are not needed to package a prebuilt binary.
          su builder -c 'cd /tmp/pkg && makepkg -d --noconfirm'
          file=$(ls /tmp/pkg/*.pkg.tar.zst)
          cp "$file" .
          echo "file=$(basename "$file")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: ${{ steps.build.outputs.file }}
          retention-days: 3
      - name: Attach to the release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.release.outputs.release_id }}
          FILE: ${{ steps.build.outputs.file }}
        run: |
          curl -sSf -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/octet-stream" --data-binary @"$FILE" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets?name=$FILE" > /dev/null
